version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: reward_postgres
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: secure_app_password
      POSTGRES_DB: ad_rewards_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: reward_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: reward_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://app_user:secure_app_password@postgres:5432/ad_rewards_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super_secret_jwt_key_change_in_production_32bytes
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
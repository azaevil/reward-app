name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Java Kurulumu (JDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter SDK Kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Android Platform Dosyalarini Olustur ve Paketleri Indir
        run: |
          cd mobile
          flutter create --platforms=android --org com.rewardapp .
          flutter pub get

      - name: APK Derle (Release)
        run: |
          cd mobile
          flutter build apk --release

      - name: Derlenen APK'yi Yukle (Indirilebilir Yap)
        uses: actions/upload-artifact@v4
        with:
          name: reward-app-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk


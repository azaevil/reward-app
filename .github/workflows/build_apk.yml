name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Java Kurulumu (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter SDK Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Mobil Uygulamayi Olustur ve Derle
        run: |
          # 1. Temiz ve eksiksiz bir Flutter projesi olustur
          flutter create --org com.rewardapp --project-name mobile_reward_app app_build
          
          # 2. Kodlarimizi ve pubspec dosyamizi projenin icine tasi
          cp -r mobile/lib/* app_build/lib/
          cp mobile/pubspec.yaml app_build/
          
          cd app_build
          
          # 3. flutter_secure_storage icin minSdkVersion'i 21 yap
          find android -name "build.gradle*" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' {} +

          flutter pub get
          flutter build apk --debug --no-tree-shake-icons
          
          # 4. Ciktiyi hazirla
          mkdir -p ../apk_output
          cp build/app/outputs/flutter-apk/*.apk ../apk_output/

      - name: Derlenen APK'yi Yukle (Indirilebilir Yap)
        uses: actions/upload-artifact@v4
        with:
          name: reward-app-apk
          path: apk_output/*.apk


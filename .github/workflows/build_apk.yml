name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Java Kurulumu (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter SDK Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Android Platformunu Hazirla
        run: |
          # Temiz bir dizinde android altyapisini olustur
          flutter create --platforms=android --org com.rewardapp --project-name mobile_reward_app /tmp/fresh_app
          
          # Olusturulan android klasorunu mobile altina tasi
          rm -rf mobile/android
          cp -r /tmp/fresh_app/android mobile/
          
          cd mobile
          # flutter_secure_storage icin minSdkVersion'i 21 yap
          find android -name "build.gradle*" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' {} +
          find android -name "build.gradle*" -exec sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' {} +

          flutter pub get

      - name: APK Derle
        run: |
          cd mobile
          flutter build apk --debug --no-tree-shake-icons

      - name: Derlenen APK'yi Yukle
        uses: actions/upload-artifact@v4
        with:
          name: reward-app-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk


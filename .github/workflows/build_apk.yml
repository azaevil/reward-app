name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Java Kurulumu (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter SDK Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Mobil Uygulamayi Olustur ve Derle
        run: |
          # 1. Temiz bir Flutter projesi olustur
          flutter create --platforms=android --org com.rewardapp --project-name mobile_reward_app app_build
          
          # 2. Kodlarimizi lib altina kopyala
          cp -r mobile/lib/* app_build/lib/
          
          cd app_build
          
          # 3. Paketleri temiz sekilde ekle
          flutter pub add http flutter_secure_storage
          
          # 4. flutter_secure_storage icin compileSdk'yi 37 ve minSdkVersion'i 21 yap
          find android -name "build.gradle.kts" -exec sed -i 's/compileSdk = .*/compileSdk = 37/g' {} +
          find android -name "build.gradle.kts" -exec sed -i 's/minSdk = .*/minSdk = 21/g' {} +
          find android -name "build.gradle" -exec sed -i 's/compileSdkVersion .*/compileSdkVersion 37/g' {} +
          find android -name "build.gradle" -exec sed -i 's/minSdkVersion .*/minSdkVersion 21/g' {} +

          # 5. APK Derle
          flutter build apk --debug --no-tree-shake-icons
          
          # 6. Ciktiyi hazirla
          mkdir -p ../apk_output
          cp build/app/outputs/flutter-apk/*.apk ../apk_output/

      - name: Derlenen APK'yi Yukle (Indirilebilir Yap)
        uses: actions/upload-artifact@v4
        with:
          name: reward-app-apk
          path: apk_output/*.apk

